0" text-anchor="middle">SSM Agent only, no SSH daemon exposed</text><rect width="500" height="290" x="612" y="330" fill="#EAF1FB" stroke="#0972D3" stroke-width="1.4"/><rect width="18" height="18" x="622" y="322" fill="#0972D3"/><text x="648" y="336" fill="#16191F" font-size="11.5" font-weight="700">Docker Compose · the running stack</text><rect width="216" height="120" x="632" y="356" fill="#FFF" stroke="#232F3E" stroke-width="1.3" rx="6"/><text x="740" y="374" fill="#16191F" font-size="11" font-weight="700" text-anchor="middle">frontend · nginx</text><rect width="72" height="72" x="704" y="384" fill="#ED7100" rx="10"/><use width="36" height="36" x="722" y="402" href="#icon-docker"/><text x="740" y="468" fill="#5C6670" font-size="9.5" text-anchor="middle">published :8080 · read-only root</text><line x1="848" x2="892" y1="416" y2="416" stroke="#232F3E" stroke-width="1.4" marker-end="url(#a)"/><text x="870" y="406" fill="#5C6670" font-size="8.8" text-anchor="middle">/api/</text><rect width="196" height="120" x="896" y="356" fill="#FFF" stroke="#232F3E" stroke-width="1.3" rx="6"/><text x="994" y="374" fill="#16191F" font-size="11" font-weight="700" text-anchor="middle">api · uvicorn</text><rect width="72" height="72" x="958" y="384" fill="#ED7100" rx="10"/><use width="36" height="36" x="976" y="402" href="#icon-docker"/><text x="994" y="468" fill="#5C6670" font-size="9.5" text-anchor="middle">internal :8000, never published</text><rect width="460" height="100" x="632" y="500" fill="#F1F6E6" stroke="#7AA116" stroke-width="1.6" rx="6"/><text x="862" y="518" fill="#16191F" font-size="11" font-weight="700" text-anchor="middle">/opt/npn/backend/data · EBS volume, read-only</text><text x="862" y="536" fill="#5C6670" font-size="9.5" text-anchor="middle">product.duckdb 20 MB · history.parquet 32 MB · backtest.parquet 78 MB</text><rect width="52" height="52" x="800" y="546" fill="#7AA116" rx="8"/><use width="32" height="32" x="810" y="556" href="#icon-s3"/><line x1="740" x2="740" y1="476" y2="500" stroke="#232F3E" stroke-width="1.3" marker-end="url(#a)"/><line x1="994" x2="994" y1="476" y2="500" stroke="#232F3E" stroke-width="1.3" marker-end="url(#a)"/><rect width="776" height="70" x="336" y="640" fill="#F2F4F4" stroke="#5C6670" stroke-dasharray="3 2" stroke-width="1.2" rx="6"/><text x="356" y="666" fill="#16191F" font-size="11" font-weight="600">/api/v1/ready</text><text x="356" y="684" fill="#5C6670" font-size="9.5">frontend does not route traffic until this reports the data layer is queryable — not just &quot;process alive&quot;</text><rect width="360" height="900" x="1184" y="106" fill="none" stroke="#8C8C8C" stroke-dasharray="3 3" stroke-width="1.2"/><text x="1364" y="98" fill="#5C6670" font-size="11.5" font-weight="700" text-anchor="middle">SUPPORTING AWS SERVICES</text><g fill="#16191F" font-size="11" text-anchor="middle"><rect width="76" height="76" x="1210" y="140" fill="#DD344C" rx="10"/><use width="44" height="44" x="1225" y="156" href="#icon-iam"/><text x="1248" y="234">AWS IAM</text><rect width="76" height="76" x="1310" y="140" fill="#DD344C" rx="10"/><use width="44" height="44" x="1326" y="156" href="#icon-kms"/><text x="1348" y="234">AWS KMS</text><rect width="76" height="76" x="1410" y="140" fill="#E7157B" rx="10"/><use width="44" height="44" x="1426" y="156" href="#icon-ssm"/><text x="1448" y="234">Systems</text><text x="1448" y="248">Manager</text><rect width="76" height="76" x="1210" y="290" fill="#ED7100" rx="10"/><use width="44" height="44" x="1226" y="308" href="#icon-ecr"/><text x="1248" y="384">Amazon ECR</text><rect width="76" height="76" x="1310" y="290" fill="#7AA116" rx="10"/><use width="44" height="44" x="1326" y="306" href="#icon-s3"/><text x="1348" y="384">Amazon S3</text><rect width="76" height="76" x="1410" y="290" fill="#ED7100" rx="10"/><use width="44" height="44" x="1424" y="306" href="#icon-ec2"/><text x="1448" y="384">Amazon EC2</text><rect width="76" height="76" x="1210" y="440" fill="#E7157B" rx="10"/><use width="44" height="44" x="1226" y="456" href="#icon-cloudtrail"/><text x="1248" y="534">CloudTrail</text><rect width="76" height="76" x="1310" y="440" fill="#E7157B" rx="10"/><use width="44" height="44" x="1326" y="456" href="#icon-cloudwatch"/><text x="1348" y="534">CloudWatch</text><rect width="76" height="76" x="1410" y="440" fill="#8C4FFF" rx="10"/><use width="44" height="44" x="1426" y="456" href="#icon-vpc"/><text x="1448" y="534">VPC / SG</text></g><text x="1210" y="600" fill="#5C6670" font-size="10.5" font-weight="700">WHY EACH ONE IS HERE</text><line x1="1210" x2="1544" y1="610" y2="610" stroke="#DADFE3" stroke-width="1"/><text x="1210" y="632" fill="#16191F" font-size="9.5">IAM / KMS — OIDC trust + SecureString encryption</text><text x="1210" y="652" fill="#16191F" font-size="9.5">Systems Manager — command channel; port 22 stays closed</text><text x="1210" y="672" fill="#16191F" font-size="9.5">ECR — image registry, tagged by commit sha</text><text x="1210" y="692" fill="#16191F" font-size="9.5">S3 — one-time data sync, not a runtime dependency</text><text x="1210" y="712" fill="#16191F" font-size="9.5">CloudTrail / CloudWatch — every API call &amp; log, auditable</text><text x="1210" y="732" fill="#16191F" font-size="9.5">EC2 — the one always-on compute instance</text><rect width="900" height="170" x="24" y="1030" fill="none" stroke="#5C6670" stroke-dasharray="4 3" stroke-width="1.3"/><text x="40" y="1022" fill="#5C6670" font-size="11.5" font-weight="700">EXTERNAL · NOT AWS-MANAGED</text><rect width="360" height="110" x="56" y="1058" fill="#FFF" stroke="#232F3E" stroke-width="1.3" rx="6"/><text x="236" y="1078" fill="#16191F" font-size="11.5" font-weight="700" text-anchor="middle">GitHub · source of truth</text><circle cx="120" cy="1120" r="28" fill="none" stroke="#5C6670" stroke-width="2.2"/><path fill="none" stroke="#5C6670" stroke-linecap="round" stroke-width="2.6" d="M120,1106 A14,14 0 1 1 106,1120"/><path fill="none" stroke="#5C6670" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="M120,1106 L127,1101 M120,1106 L127,1111"/><text x="236" y="1108" fill="#5C6670" font-size="10" text-anchor="middle">main branch, protected</text><text x="236" y="1126" fill="#5C6670" font-size="10" text-anchor="middle">Actions workflow: ci.yml</text><text x="236" y="1144" fill="#5C6670" font-size="10" text-anchor="middle">no AWS key stored here, ever</text><rect width="440" height="110" x="460" y="1058" fill="#FFF" stroke="#232F3E" stroke-width="1.3" rx="6"/><text x="680" y="1078" fill="#16191F" font-size="11.5" font-weight="700" text-anchor="middle">What never leaves this box</text><text x="480" y="1102" fill="#5C6670" font-size="9.8">• long-lived AWS access keys</text><text x="480" y="1120" fill="#5C6670" font-size="9.8">• the Gemini API key (fetched at deploy time, not stored here)</text><text x="480" y="1138" fill="#5C6670" font-size="9.8">• any SSH private key — none exists for this box</text><text x="480" y="1156" fill="#5C6670" font-size="9.8">• the 130 MB data layer — synced once, outside the deploy path</text><line x1="24" x2="1544" y1="1216" y2="1216" stroke="#DADFE3" stroke-width="1"/><text x="24" y="1232" fill="#5C6670" font-size="10">Every deploy re-checks the frozen forecast canary (total_28d = 3331.3681) against the live public IP before it&apos;s called successful.</text></svg>