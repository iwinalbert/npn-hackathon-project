</g></defs><text x="24" y="34" fill="#16191F" font-size="22" font-weight="700">Retail Demand Forecasting — Cloud Deployment Architecture</text><text x="24" y="56" fill="#5C6670" font-size="12.5">Push to GitHub main → GitHub Actions (OIDC) → AWS · EC2 running Docker Compose, no SSH, no stored credentials</text><rect width="150" height="340" x="10" y="330" fill="none" stroke="#232F3E" stroke-dasharray="3 3" stroke-width="1.2"/><circle cx="85" cy="400" r="24" fill="none" stroke="#0972D3" stroke-width="2.2"/><circle cx="85" cy="392" r="8" fill="none" stroke="#0972D3" stroke-width="2.6"/><path fill="none" stroke="#0972D3" stroke-linecap="round" stroke-width="2.6" d="M69,417 Q69,401 85,401 Q101,401 101,417"/><text x="85" y="448" fill="#16191F" font-size="12" font-weight="600" text-anchor="middle">Developer</text><text x="85" y="463" fill="#5C6670" font-size="9.5" text-anchor="middle">git push main</text><circle cx="85" cy="500" r="24" fill="none" stroke="#5C6670" stroke-width="2.2"/><path fill="none" stroke="#5C6670" stroke-linecap="round" stroke-width="2.6" d="M85,488 A12,12 0 1 1 73,500"/><path fill="none" stroke="#5C6670" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="M85,488 L91,484 M85,488 L91,492"/><text x="85" y="548" fill="#16191F" font-size="12" font-weight="600" text-anchor="middle">GitHub Actions</text><text x="85" y="563" fill="#5C6670" font-size="9.5" text-anchor="middle">CI/CD runner</text><circle cx="85" cy="600" r="24" fill="none" stroke="#0972D3" stroke-width="2.2"/><circle cx="85" cy="592" r="8" fill="none" stroke="#0972D3" stroke-width="2.6"/><path fill="none" stroke="#0972D3" stroke-linecap="round" stroke-width="2.6" d="M69,617 Q69,601 85,601 Q101,601 101,617"/><text x="85" y="648" fill="#16191F" font-size="12" font-weight="600" text-anchor="middle">Judge / Public</text><text x="85" y="663" fill="#5C6670" font-size="9.5" text-anchor="middle">browser, port 8080</text><circle cx="210" cy="500" r="26" fill="#F2F4F4" stroke="#8C4FFF" 